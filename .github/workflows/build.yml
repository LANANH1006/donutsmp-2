name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Unzip source
        run: unzip -o donutlike-mod-v3-source.zip

      - name: Build
        run: |
          set -o pipefail
          cd donutlike
          gradle build --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Error summary
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "error:|What went wrong|Could not|symbol:|location:" -A2 build.log | head -80 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: donutlike-mod
          path: |
            donutlike/build/libs/donutlike-1.1.0.jar
            build.log
